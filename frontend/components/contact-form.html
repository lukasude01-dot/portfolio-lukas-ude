                <!-- =====================================================
                     CONTACT FORM

                     PURPOSE:
                     Sends a message to Lukas via the backend
                     (POST /api/contact). Nothing secret is in this file:
                     e-mail delivery happens on the server.

                     EDIT HERE:
                     - Labels, placeholder texts, button text (below)
                     - Topic options + validation rules:
                       /shared/contact-schema.js
                     - Endpoint URL: /frontend/config/site.js -> apiOrigin

                     RELATED STYLES:
                     /frontend/styles/components/forms.css

                     RELATED SCRIPT:
                     /frontend/scripts/modules/contact-form.js
                     (backend: /backend/src/routes/contact.js)

                     EDIT WITH CARE:
                     The "name" attributes must match
                     /shared/contact-schema.js.
                ===================================================== -->
                <noscript>
                    <p class="contact-form__noscript">Das Formular benötigt JavaScript zum Schutz vor Spam. Du erreichst mich auch über die Links auf dieser Seite.</p>
                </noscript>
                <form class="contact-form" novalidate
                      data-contact-form
                      data-endpoint="{{ site.contactEndpointUrl }}"
                      data-token-endpoint="{{ site.contactTokenUrl }}">

                    <div class="contact-form__grid">
                        <!-- CONTACT FORM - NAME -->
                        <div class="form-field">
                            <label class="form-field__label" for="contact-name">Name <span aria-hidden="true">*</span></label>
                            <input class="form-field__input" id="contact-name" name="name" type="text" autocomplete="name" required maxlength="120" aria-describedby="contact-name-error">
                            <p class="form-field__error" id="contact-name-error" data-error-for="name"></p>
                        </div>

                        <!-- CONTACT FORM - E-MAIL -->
                        <div class="form-field">
                            <label class="form-field__label" for="contact-email">E-Mail <span aria-hidden="true">*</span></label>
                            <input class="form-field__input" id="contact-email" name="email" type="email" autocomplete="email" required maxlength="200" aria-describedby="contact-email-error">
                            <p class="form-field__error" id="contact-email-error" data-error-for="email"></p>
                        </div>

                        <!-- CONTACT FORM - COMPANY (optional) -->
                        <div class="form-field">
                            <label class="form-field__label" for="contact-company">Unternehmen <span class="form-field__optional">(optional)</span></label>
                            <input class="form-field__input" id="contact-company" name="company" type="text" autocomplete="organization" maxlength="160">
                        </div>

                        <!-- CONTACT FORM - TOPIC (options from /shared/contact-schema.js) -->
                        <div class="form-field">
                            <label class="form-field__label" for="contact-topic">Worum geht es? <span aria-hidden="true">*</span></label>
                            <select class="form-field__input form-field__select" id="contact-topic" name="topic" required aria-describedby="contact-topic-error">
                                <option value="">Bitte auswählen</option>
                                <!-- @render contact-topics -->
                            </select>
                            <p class="form-field__error" id="contact-topic-error" data-error-for="topic"></p>
                        </div>
                    </div>

                    <!-- CONTACT FORM - MESSAGE -->
                    <div class="form-field">
                        <label class="form-field__label" for="contact-message">Deine Nachricht <span aria-hidden="true">*</span></label>
                        <textarea class="form-field__input form-field__textarea" id="contact-message" name="message" rows="6" required minlength="20" maxlength="4000" aria-describedby="contact-message-hint contact-message-error"></textarea>
                        <p class="form-field__hint" id="contact-message-hint">Wo stehst du heute – und was soll besser funktionieren?</p>
                        <p class="form-field__error" id="contact-message-error" data-error-for="message"></p>
                    </div>

                    <!-- CONTACT FORM - SPAM PROTECTION (honeypot)
                         Invisible to people. Bots fill it in -> the server rejects
                         the message. DO NOT REMOVE. -->
                    <div class="contact-form__honeypot" aria-hidden="true">
                        <label for="contact-website">Dieses Feld leer lassen</label>
                        <input id="contact-website" name="website" type="text" tabindex="-1" autocomplete="off">
                    </div>

                    <!-- CONTACT FORM - PRIVACY NOTICE + CONSENT -->
                    <div class="form-field form-field--checkbox">
                        <input class="form-field__checkbox" id="contact-privacy" name="privacy" type="checkbox" required aria-describedby="contact-privacy-error">
                        <label for="contact-privacy">
                            Ich bin einverstanden, dass meine Angaben zur Beantwortung meiner Anfrage verwendet werden.
                            Mehr in der <a href="/datenschutz/">Datenschutzerklärung</a>.
                        </label>
                        <p class="form-field__error" id="contact-privacy-error" data-error-for="privacy"></p>
                    </div>

                    <div class="contact-form__footer">
                        <!-- EDIT: SUBMIT BUTTON TEXT -->
                        <button class="button button--primary" type="submit" data-submit>
                            <span data-submit-label>Nachricht senden</span><span class="button__arrow" aria-hidden="true">→</span>
                        </button>
                        <p class="contact-form__note text-small text-muted">Deine Nachricht wird verschlüsselt übertragen. Kein Tracking, kein Newsletter.</p>
                    </div>

                    <!-- CONTACT FORM - STATUS MESSAGES (success / error) -->
                    <div class="contact-form__status" role="status" aria-live="polite" data-form-status></div>
                </form>
                <!-- ================= END CONTACT FORM ================= -->

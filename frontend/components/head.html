    <!-- =========================================================
         HEAD  (invisible page information: SEO, fonts, styles)

         PURPOSE:
         Title, description, social sharing (Open Graph), favicon,
         stylesheet and scripts for every page.

         EDIT HERE:
         - Nothing per page! Page titles and descriptions are set
           at the top of each page file (the "---" block), e.g.
           /frontend/pages/funnels.html
         - Default description / share image:
           /frontend/config/site.js

         SECURITY:
         Only local files are loaded. No trackers, no Google Fonts,
         no third-party scripts (see /docs/SECURITY.md).
    ========================================================= -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- SEO: TITLE & DESCRIPTION (set per page in the front matter) -->
    <title>{{ page.fullTitle }}</title>
    <meta name="description" content="{{ page.description }}">
    <meta name="robots" content="{{ page.robots }}">
    <link rel="canonical" href="{{ page.canonical }}">

    <!-- SOCIAL SHARING (Open Graph) -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="{{ site.name }}">
    <meta property="og:locale" content="{{ site.locale }}">
    <meta property="og:title" content="{{ page.fullTitle }}">
    <meta property="og:description" content="{{ page.description }}">
    <meta property="og:url" content="{{ page.canonical }}">
    <meta property="og:image" content="{{ page.ogImageUrl }}">
    <meta name="twitter:card" content="summary_large_image">

    <!-- ICONS -->
    <meta name="theme-color" content="#090A09">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">

    <!-- FONTS (self-hosted) + STYLES -->
    <link rel="preload" href="/assets/fonts/cormorant-garamond-variable-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/assets/fonts/manrope-variable-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/styles/main.css">

    <!-- SCRIPTS
         boot.js:  tiny, marks the page as "JavaScript available"
         main.js:  all interactions (loads after the page) -->
    <script src="/scripts/boot.js"></script>
    <script type="module" src="/scripts/main.js"></script>

    <!-- STRUCTURED DATA (schema.org, generated by the build) -->
    {{{ page.structuredData }}}
    <!-- ================= END HEAD ================= -->
